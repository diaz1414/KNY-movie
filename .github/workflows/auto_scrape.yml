name: Auto Scrape Streaming Data

on:
  schedule:
    - cron: '0 * * * *' # Menjalankan otomatis setiap 1 jam sekali
  workflow_dispatch: # Mengaktifkan tombol manual "Run workflow" di tab Actions GitHub

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm install axios

    - name: Run Scraper
      run: node scraper-test/fetch_data.js

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data/*.json
        git diff-index --quiet HEAD || (git commit -m "Auto-update streaming data [skip ci]" && git push)
