name: Auto Scrape Streaming Data

on:
  schedule:
    - cron: '0 * * * *' # Menjalankan otomatis setiap 1 jam sekali
  workflow_dispatch: # Mengaktifkan tombol manual "Run workflow" di tab Actions GitHub

# Cegah proses tumpuk-tindih agar tidak boros kuota menit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Batasi maksimal 5 menit agar tidak jalan terus kalau web sumber macet
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # Cukup 1 commit terakhir agar proses clone instan (hemat detik)

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install axios (Quick)
      # Memakai cache & no-audit agar selesai dalam 1-2 detik saja
      run: npm install axios --no-package-lock --no-audit --prefer-offline

    - name: Run Scraper
      run: node scraper-test/fetch_data.js

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Bersihkan file sampah di luar folder target
        git checkout -- package.json package-lock.json 2>/dev/null || true
        
        # Tambahkan perubahan data json
        git add public/data/
        
        # Buang sisa file tak terpakai
        git stash --keep-index 2>/dev/null || true
        
        # Hanya commit & push jika ada data streaming yang benar-benar baru
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update streaming data [skip ci]"
          git push origin HEAD:main
        else
          echo "Tidak ada perubahan data streaming baru."
        fi
