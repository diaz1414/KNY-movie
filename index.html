  <style>
    #security-alert-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);

    .modal-box {

      border: 1px solid rgba(229, 9, 20, 0.3);
      border-radius: 28px;
      padding: 40px;
      max-width: 450px;
      width: 100%;

    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      width: 80px;
      height: 80px;
      background: rgba(229, 9, 20, 0.1);
      color: #E50914;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 1px solid rgba(229, 9, 20, 0.2);
      animation: pulseScale 2s infinite;
    }

    @keyframes pulseScale {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.2);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 20px 10px rgba(229, 9, 20, 0);
      }
    }

    .modal-title {

      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

      background: #ff0f1e;
    }

    .modal-btn:active {
